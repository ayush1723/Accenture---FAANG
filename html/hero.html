<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .profile-card {
            background: white;
            width: 300px;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: background-color 0.4s ease;
        }

        .profile-pic {
            border-radius: 50%;
            border: 3px solid #4CAF50;
            width: 150px;
            height: 150px;
        }

        .name {
            font-size: 24px;
            margin: 10px 0;
            color: #333;
        }

        .bio {
            font-size: 14px;
            color: #555;
        }

        button {
            padding: 10px 15px;
            margin-top: 15px;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img src="Titanic.jpeg" class="profile-pic" alt="Profile Picture">

        <h2 class="name">Ayush</h2>

        <p class="bio">
            This is the basic web page for Testing.
        </p>

        <button id="colorBtn">Change Background</button>
    </div>

    <script>
        document.getElementById("colorBtn").addEventListener("click", function() {
            const colors = ["#FFDEE9", "#D0F0C0", "#E0BBE4", "#C4FCEF", "#FFD3B6"];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.querySelector(".profile-card").style.backgroundColor = randomColor;
        });
    </script>

</body>
</html>
